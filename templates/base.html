<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Flask Auth System{% endblock %}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f5f0;
      color: #1e293b;
      padding-bottom: 40px;
    }

    nav {
      background: #243447;
      color: #ffffff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 6px 20px rgba(49, 46, 129, 0.25);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
      color: #ffffff;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-links a,
    .nav-links button {
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .nav-links a:hover,
    .nav-links button:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .container {
      max-width: 520px;
      margin: 36px auto 0;
      padding: 0 16px;
    }

    .container.wide {
      max-width: 720px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 32px rgba(30, 41, 59, 0.12);
    }

    .card-header {
      background: #2f5d46;
      color: #ffffff;
      padding: 22px 26px;
    }

    .card-header h1 {
      font-size: 1.55rem;
      margin-bottom: 4px;
    }

    .card-header p {
      font-size: 0.92rem;
      color: #f3e8ff;
    }

    .card-body {
      padding: 26px;
    }

    .alert {
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border-left: 5px solid #10b981;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border-left: 5px solid #ef4444;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: #312e81;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.96rem;
      background: #f8fafc;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input:focus {
      background: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .hint {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 4px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #2f5d46;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
      transition: transform 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .switch-link {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: #475569;
    }

    .switch-link a {
      color: #7771e4;
      font-weight: 700;
      text-decoration: none;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}" class="brand">AuthVault</a>
    <div class="nav-links">
      {% if session.get("user_id") %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <form method="POST" action="{{ url_for('logout') }}" style="display:inline;">
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}">Register</a>
      {% endif %}
    </div>
  </nav>

  <div class="container {% block container_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
