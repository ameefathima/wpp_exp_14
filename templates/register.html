{% extends "base.html" %}
{% block title %}Register - Flask Auth{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h1>Create Account</h1>
    <p>Register with a unique username, email, and strong password.</p>
  </div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('register') }}" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          value="{{ username or '' }}"
          placeholder="e.g., arjun_dev"
          required
        />
        <div class="hint">3-20 characters: letters, numbers, or underscores.</div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ email or '' }}"
          placeholder="arjun@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Minimum 8 chars with letters & numbers"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Re-enter your password"
          required
        />
      </div>

      <button type="submit" class="btn-primary">Register</button>
    </form>

    <div class="switch-link">
      Already have an account? <a href="{{ url_for('login') }}">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}
